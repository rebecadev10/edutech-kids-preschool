<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pesca mágica de números | Aprende jugando</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a3a5f 0%, #16a085 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 1050px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 30px;
            background: #2980b9;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
            width: 100%;
            height: auto;
            cursor: none;
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 25px;
        }
        .stat-box {
            padding: 8px 15px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 100px;
            text-align: center;
        }
        .score { background: #f39c12; }
        .lives { background: #e74c3c; }
        .level { background: #27ae60; }

        .level-dots {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        .dot {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #bdc3c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.completed { background: #2ecc71; }
        .dot.active { background: #3498db; transform: scale(1.2); box-shadow: 0 0 10px #3498db; }
        .dot.locked { opacity: 0.5; cursor: not-allowed; }

        .btn {
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-next { background: #8e44ad; }
        .btn-next:disabled { background: #95a5a6; }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="info-panel">
        <div class="stat-box score">🐟 <span id="scoreVal">0</span>/<span id="totalVal">0</span></div>
        <div class="stat-box lives">❤️ <span id="livesVal">3</span></div>
        <div class="stat-box level" id="levelLabel">Nivel 1</div>
        
        <div class="level-dots" id="levelDots"></div>
        
        <button id="nextBtn" class="btn btn-next" disabled>Siguiente Nivel ➡️</button>
        <button><a href="./index.html">Volver al Inicio</a></button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let W = 1000, H = 550;
    let hook = { x: W/2, y: H/2, r: 15 };
    let currentLevel = 1;
    let maxUnlockedLevel = 1;
    let fishes = [], sharks = [], bubbles = [];
    let score = 0, lives = 3, nextNum = 1;
    let gameActive = true;

    const COLORS = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];

    function initLevel(n) {
        currentLevel = n;
        score = 0;
        lives = 3;
        nextNum = 1;
        gameActive = true;
        fishes = [];
        sharks = [];
        
        const fishCount = 2 + n;
        const sharkCount = Math.floor(n / 2);

        for(let i=1; i<=fishCount; i++) {
            fishes.push({
                num: i,
                x: Math.random()*(W-100)+50,
                y: Math.random()*(H-100)+50,
                r: 25,
                color: COLORS[i % COLORS.length],
                vx: (Math.random()-0.5) * (2 + n*0.2),
                vy: (Math.random()-0.5) * (2 + n*0.2),
                angle: 0
            });
        }

        for(let i=0; i<sharkCount; i++) {
            sharks.push({
                x: Math.random()*W,
                y: Math.random()*H,
                r: 35,
                vx: (Math.random()-0.5) * 3,
                vy: (Math.random()-0.5) * 3
            });
        }

        document.getElementById('nextBtn').disabled = true;
        updateUI();
        renderDots();
    }

    function drawFish(f) {
        ctx.save();
        ctx.translate(f.x, f.y);
        // Girar pez según dirección
        if(f.vx < 0) ctx.scale(-1, 1);

        // Cola
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.moveTo(f.r, 0);
        ctx.lineTo(f.r + 15, -10);
        ctx.lineTo(f.r + 15, 10);
        ctx.fill();

        // Cuerpo (gradiente para volumen)
        let grad = ctx.createRadialGradient(-5, -5, 0, 0, 0, f.r);
        grad.addColorStop(0, 'white');
        grad.addColorStop(1, f.color);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, f.r, f.r*0.7, 0, 0, Math.PI*2);
        ctx.fill();

        // Ojo
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(-f.r/2, -f.r/4, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(-f.r/2 - 1, -f.r/4, 3, 0, Math.PI*2);
        ctx.fill();

        // Número
        ctx.scale(f.vx < 0 ? -1 : 1, 1); // Reset escala para el texto
        ctx.fillStyle = "white";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 4;
        ctx.fillText(f.num, 0, 7);
        
        ctx.restore();
    }

    function drawShark(s) {
        ctx.save();
        ctx.translate(s.x, s.y);
        if(s.vx < 0) ctx.scale(-1, 1);
        ctx.font = "40px Arial";
        ctx.fillText("🦈", -20, 15);
        ctx.restore();
    }

    function update() {
        if(!gameActive) return;

        fishes.forEach(f => {
            f.x += f.vx; f.y += f.vy;
            if(f.x < f.r || f.x > W-f.r) f.vx *= -1;
            if(f.y < f.r || f.y > H-f.r) f.vy *= -1;

            let dist = Math.hypot(hook.x - f.x, hook.y - f.y);
            if(dist < f.r + hook.r) {
                if(f.num === nextNum) {
                    fishes = fishes.filter(fish => fish !== f);
                    score++;
                    nextNum++;
                    if(fishes.length === 0) winLevel();
                } else {
                    lives--;
                    f.vx *= -2; // rebote de error
                    if(lives <= 0) gameOver();
                }
                updateUI();
            }
        });

        sharks.forEach(s => {
            s.x += s.vx; s.y += s.vy;
            if(s.x < 0 || s.x > W) s.vx *= -1;
            if(s.y < 0 || s.y > H) s.vy *= -1;

            if(Math.hypot(hook.x - s.x, hook.y - s.y) < s.r) {
                lives--;
                hook.x = W/2; hook.y = H/2; // Teleport de seguridad
                if(lives <= 0) gameOver();
                updateUI();
            }
        });
    }

    function winLevel() {
        gameActive = false;
        if(currentLevel === maxUnlockedLevel) maxUnlockedLevel++;
        document.getElementById('nextBtn').disabled = false;
        renderDots();
    }

    function gameOver() {
        gameActive = false;
        alert("¡Oh no! Inténtalo de nuevo.");
        initLevel(currentLevel);
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        
        // Efecto Agua (Olas simples)
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        for(let i=0; i<5; i++) {
            ctx.beginPath();
            ctx.arc((Date.now()/20 + i*200)%W, 50 + i*100, 50, 0, Math.PI*2);
            ctx.fill();
        }

        fishes.forEach(drawFish);
        sharks.forEach(drawShark);

        // Dibujar Anzuelo
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(hook.x, 0);
        ctx.lineTo(hook.x, hook.y - 10);
        ctx.stroke();
        ctx.font = "30px Arial";
        ctx.fillText("🪝", hook.x - 15, hook.y + 10);
    }

    function updateUI() {
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('totalVal').innerText = score + fishes.length;
        document.getElementById('livesVal').innerText = lives;
        document.getElementById('levelLabel').innerText = `Nivel ${currentLevel}`;
    }

    function renderDots() {
        const container = document.getElementById('levelDots');
        container.innerHTML = '';
        for(let i=1; i<=10; i++) {
            const dot = document.createElement('div');
            dot.className = `dot ${i === currentLevel ? 'active' : ''} ${i < maxUnlockedLevel ? 'completed' : ''} ${i > maxUnlockedLevel ? 'locked' : ''}`;
            dot.innerText = i;
            dot.onclick = () => { if(i <= maxUnlockedLevel) initLevel(i); };
            container.appendChild(dot);
        }
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        hook.x = (e.clientX - rect.left) * (W / rect.width);
        hook.y = (e.clientY - rect.top) * (H / rect.height);
    });

    document.getElementById('nextBtn').onclick = () => {
        if(currentLevel < 10) initLevel(currentLevel + 1);
    };

    // Ajuste inicial
    canvas.width = W; canvas.height = H;
    initLevel(1);
    
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
