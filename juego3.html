<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Súper Arrasta y Encaja - 15 Niveles</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 1100px;
            border: 8px solid #fff;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 30px;
            background: #ffffff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            cursor: grab;
            width: 100%;
            height: auto;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 30px;
        }

        .score-box {
            background: #ff4757;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            box-shadow: 0 4px 0 #cf3543;
        }

        .level-box {
            background: #1e90ff;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #0e70cf;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #2ed573;
            border: none;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #26af5f;
            transition: 0.1s;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #26af5f;
        }

        .level-btn {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dfe4ea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .level-btn.active {
            background: #ffa502;
            color: white;
            transform: scale(1.1);
        }

        .message {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2f3542;
            margin-top: 15px;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="info-panel">
        <div class="score-box">⭐ <span id="scoreValue">0</span>/<span id="totalValue">0</span></div>
        <div class="level-box" id="levelName">Nivel 1</div>
        <div class="controls" id="levelButtons"></div>
        <button id="resetBtn">🔄 Reiniciar</button>
    </div>
    
    <div id="messageBox" class="message">¡Lleva las figuras a su sombra!</div>
    <button><a href="./index.html">Volver al Inicio</a></button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreValue');
    const totalSpan = document.getElementById('totalValue');
    const levelNameSpan = document.getElementById('levelName');
    const messageDiv = document.getElementById('messageBox');
    const resetBtn = document.getElementById('resetBtn');
    const levelButtonsDiv = document.getElementById('levelButtons');

    let W = 1000, H = 550;
    let figures = [];
    let currentLevelIdx = 0;
    let score = 0;
    let dragging = false;
    let dragIndex = -1;
    let dragOffsetX = 0, dragOffsetY = 0;

    // Colores Brillantes (Candy Palette)
    const COLORS = ["#FF5E5E", "#45E3FF", "#62FF84", "#FFD93D", "#FF8B3D", "#C780FF", "#FF80CE", "#20BF6B", "#EB3B5A", "#4B7BEC"];

    const LEVELS = [
        { name: "Inicio 🌈", types: ["circle", "square"] },
        { name: "Básico ✨", types: ["circle", "square", "triangle"] },
        { name: "Formas 💎", types: ["circle", "square", "triangle", "rectangle"] },
        { name: "Estrellas ⭐", types: ["circle", "triangle", "star", "heart"] },
        { name: "Geometría 📐", types: ["square", "triangle", "pentagon", "diamond"] },
        { name: "Nubes ☁️", types: ["cloud", "circle", "oval", "star"] },
        { name: "Mix 1 🎨", types: ["heart", "star", "cloud", "diamond", "circle"] },
        { name: "Avanzado 🚀", types: ["pentagon", "rectangle", "oval", "triangle", "heart"] },
        { name: "Desafío 🔥", types: ["star", "cloud", "diamond", "pentagon", "rectangle", "square"] },
        { name: "Experto 🏆", types: ["circle", "square", "triangle", "rectangle", "star", "heart", "cloud"] },
        // Nuevos Niveles
        { name: "Súper Mix 🍭", types: ["oval", "diamond", "pentagon", "cloud", "star", "heart", "circle"] },
        { name: "Simetría 💠", types: ["diamond", "diamond", "square", "square", "triangle", "triangle"] },
        { name: "Lluvia 🌧️", types: ["cloud", "cloud", "cloud", "circle", "circle", "circle"] },
        { name: "Constelación 🌌", types: ["star", "star", "star", "star", "star", "circle"] },
        { name: "MEGA FINAL 🏁", types: ["circle", "square", "triangle", "rectangle", "star", "heart", "oval", "diamond", "pentagon", "cloud"] }
    ];

    function init() {
        createLevelButtons();
        window.addEventListener('resize', resize);
        resize();
        loadLevel(0);
        
        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', moveDrag, {passive: false});
        window.addEventListener('touchend', endDrag);
        resetBtn.addEventListener('click', () => loadLevel(currentLevelIdx));
    }

    function resize() {
        const container = canvas.parentElement;
        const width = container.clientWidth - 40;
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = width + "px";
        canvas.style.height = (width * (H/W)) + "px";
        repositionFigures();
    }

    function loadLevel(idx) {
        currentLevelIdx = idx;
        const lvl = LEVELS[idx];
        levelNameSpan.innerText = lvl.name;
        figures = [];
        score = 0;

        lvl.types.forEach((type, i) => {
            figures.push({
                type,
                color: COLORS[i % COLORS.length],
                x: 0, y: 0,
                w: 75, h: 75,
                matched: false,
                targetX: 0, targetY: 0
            });
        });

        repositionFigures();
        updateUI();
        draw();
        
        document.querySelectorAll('.level-btn').forEach((b, i) => {
            b.classList.toggle('active', i === idx);
        });
        messageDiv.innerText = "¡Encuentra el lugar de cada figura!";
    }

    function repositionFigures() {
        const margin = 80;
        const spacing = (W - margin * 2) / (figures.length + 1);
        
        figures.forEach((f, i) => {
            f.x = margin + spacing * (i + 1) - f.w/2;
            f.y = 80; // Zona superior
            f.origX = f.x;
            f.origY = f.y;
            f.targetX = f.x;
            f.targetY = H - 150; // Zona inferior
        });
    }

    function drawShape(f, x, y, isShadow) {
        ctx.save();
        ctx.beginPath();
        const cx = x + f.w/2;
        const cy = y + f.h/2;

        if (isShadow) {
            ctx.fillStyle = "#d1d8e0";
        } else {
            // Gradiente para efecto 3D/Brillante
            const grad = ctx.createRadialGradient(cx-10, cy-10, 5, cx, cy, f.w);
            grad.addColorStop(0, "white");
            grad.addColorStop(0.2, f.color);
            grad.addColorStop(1, f.color);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.lineWidth = 3;
        }

        switch(f.type) {
            case "circle": ctx.arc(cx, cy, f.w/2, 0, Math.PI*2); break;
            case "square": ctx.rect(x, y, f.w, f.h); break;
            case "triangle": 
                ctx.moveTo(cx, y); ctx.lineTo(x+f.w, y+f.h); ctx.lineTo(x, y+f.h); 
                break;
            case "rectangle": ctx.rect(x, y+10, f.w, f.h-20); break;
            case "star":
                for(let i=0; i<10; i++){
                    let r = i%2===0 ? f.w/2 : f.w/4;
                    let a = Math.PI*2/10*i - Math.PI/2;
                    ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
                }
                break;
            case "heart":
                ctx.moveTo(cx, cy+15);
                ctx.bezierCurveTo(x, y, x, y-20, cx, cy-10);
                ctx.bezierCurveTo(x+f.w, y-20, x+f.w, y, cx, cy+15);
                break;
            case "pentagon":
                for(let i=0; i<5; i++){
                    let a = Math.PI*2/5*i - Math.PI/2;
                    ctx.lineTo(cx+f.w/2*Math.cos(a), cy+f.h/2*Math.sin(a));
                }
                break;
            case "diamond":
                ctx.moveTo(cx, y); ctx.lineTo(x+f.w, cy); 
                ctx.lineTo(cx, y+f.h); ctx.lineTo(x, cy);
                break;
            case "cloud":
                ctx.arc(cx-20, cy, 20, 0, Math.PI*2);
                ctx.arc(cx+20, cy, 20, 0, Math.PI*2);
                ctx.arc(cx, cy-15, 20, 0, Math.PI*2);
                break;
            case "oval":
                ctx.ellipse(cx, cy, f.w/2, f.h/3, 0, 0, Math.PI*2);
                break;
        }
        ctx.closePath();
        ctx.fill();
        if(!isShadow) ctx.stroke();
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        
        // Dibujar Sombras primero
        figures.forEach(f => {
            if(!f.matched) drawShape(f, f.targetX, f.targetY, true);
        });

        // Dibujar Figuras
        figures.forEach((f, i) => {
            if(!f.matched && i !== dragIndex) drawShape(f, f.x, f.y, false);
            if(f.matched) drawShape(f, f.targetX, f.targetY, false);
        });

        // Dibujar la que se está arrastrando al final (encima de todo)
        if(dragIndex !== -1) drawShape(figures[dragIndex], figures[dragIndex].x, figures[dragIndex].y, false);
    }

    function startDrag(e) {
        const pos = getPos(e);
        for(let i=figures.length-1; i>=0; i--){
            const f = figures[i];
            if(!f.matched && pos.x > f.x && pos.x < f.x+f.w && pos.y > f.y && pos.y < f.y+f.h){
                dragging = true;
                dragIndex = i;
                dragOffsetX = pos.x - f.x;
                dragOffsetY = pos.y - f.y;
                canvas.style.cursor = "grabbing";
                break;
            }
        }
    }

    function moveDrag(e) {
        if(!dragging) return;
        const pos = getPos(e);
        figures[dragIndex].x = pos.x - dragOffsetX;
        figures[dragIndex].y = pos.y - dragOffsetY;
        draw();
    }

    function endDrag() {
        if(!dragging) return;
        const f = figures[dragIndex];
        const dist = Math.hypot(f.x - f.targetX, f.y - f.targetY);

        if(dist < 50) {
            f.matched = true;
            f.x = f.targetX;
            f.y = f.targetY;
            score++;
            messageDiv.innerText = "¡Muy bien! 🎉";
            checkWin();
        } else {
            f.x = f.origX;
            f.y = f.origY;
            messageDiv.innerText = "¡Inténtalo de nuevo! 🌈";
        }
        
        dragging = false;
        dragIndex = -1;
        canvas.style.cursor = "grab";
        updateUI();
        draw();
    }

    function checkWin() {
        if(score === figures.length) {
            messageDiv.innerHTML = "¡EXCELENTE! ✨ Presiona el siguiente nivel.";
            if(currentLevelIdx < LEVELS.length - 1) {
                setTimeout(() => loadLevel(currentLevelIdx + 1), 1500);
            } else {
                messageDiv.innerHTML = "¡ERES UN MAESTRO DE LAS FORMAS! 🏆👑";
            }
        }
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (W / rect.width),
            y: (clientY - rect.top) * (H / rect.height)
        };
    }

    function updateUI() {
        scoreSpan.innerText = score;
        totalSpan.innerText = figures.length;
    }

    function createLevelButtons() {
        for(let i=0; i<LEVELS.length; i++) {
            const btn = document.createElement('div');
            btn.className = 'level-btn';
            btn.innerText = i + 1;
            btn.onclick = () => loadLevel(i);
            levelButtonsDiv.appendChild(btn);
        }
    }

    init();
</script>

</body>
</html>
