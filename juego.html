<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Juego: Unir Puntos Mágicos</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1e6f5c 0%, #289672 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            margin: 0;
            padding: 10px;
        }
        .game-wrapper {
            background: #ffefcf;
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 1080px;
            position: relative;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            background: #fffbf0;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
            background: #f4d58d;
            padding: 10px;
            border-radius: 15px;
        }
        .badge { background: #e76f51; color: white; padding: 5px 12px; border-radius: 10px; font-weight: bold; }
        .next-box { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #264653; }
        .target-num { background: white; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 2px solid #2a9d8f; }
        .buttons { display: flex; gap: 8px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        button { border: none; padding: 10px 18px; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        button:active { transform: translateY(3px); box-shadow: none; }
        .btn-nav { background: #bc6c25; color: white; }
        .btn-reset { background: #dda15e; }
        .btn-next { background: #606c38; color: white; }
        .message { text-align: center; margin-top: 10px; font-weight: bold; color: #283618; min-height: 1.2em; font-size: 1.2em; }
        
        /* Estilo para el mensaje de victoria final */
        .victory-flash {
            color: #d62828;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="700" height="550"></canvas>
    
    <div class="info-panel">
        <div class="badge" id="lvlName">Nivel 1</div>
        <div class="next-box">Siguiente: <div class="target-num" id="targetDisplay">1</div></div>
        <div id="progText" style="font-weight: bold;">0 / 0</div>
    </div>

    <div class="buttons">
        <button class="btn-nav" id="btnPrev">Anterior</button>
        <button class="btn-reset" id="btnReset">Reiniciar</button>
        <button class="btn-next" id="btnNext">Siguiente Nivel</button>
    </div>
    <div class="message" id="msg">¡Toca el 1 y arrastra!</div>
    <button><a href="./index.html">Volver al Inicio</a></button>
</div>

    let curLvl = 0, connected = [], isDone = false, nextTarget = 1, dragging = false;
    const msgBox = document.getElementById('msg');

    function initLvl(idx) {
        curLvl = idx; connected = [0]; isDone = false; nextTarget = 2;
        document.getElementById('lvlName').innerText = `Nivel ${idx+1}: ${LEVELS[idx].name}`;
        msgBox.classList.remove('victory-flash');
        msgBox.innerText = idx === 0 ? "¡Toca el 1 y arrastra!" : "¡A unir los puntos!";
        updateUI(); draw();
    }

    function updateUI() {
        const total = LEVELS[curLvl].pts.length;
        document.getElementById('progText').innerText = `${connected.length} / ${total}`;
        document.getElementById('targetDisplay').innerText = isDone ? "✔" : nextTarget;
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const lvl = LEVELS[curLvl], pts = lvl.pts;

        if(isDone) {
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = lvl.fillColor; ctx.fill();
            if(lvl.details) lvl.details();
        }

        ctx.beginPath(); ctx.lineWidth = 5; ctx.strokeStyle = "#fb8500";
        ctx.moveTo(pts[connected[0]].x, pts[connected[0]].y);
        connected.forEach(i => ctx.lineTo(pts[i].x, pts[i].y)); ctx.stroke();

        pts.forEach((p, i) => {
            const isConn = connected.includes(i);
            const isNext = (i + 1 === nextTarget);
            ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2);
            ctx.fillStyle = isConn ? "#2a9d8f" : (isNext ? "#e9c46a" : "#ccc");
            ctx.fill(); ctx.strokeStyle="#264653"; ctx.lineWidth=2; ctx.stroke();
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign="center";
            ctx.fillText(i+1, p.x, p.y+5);
        });
    }

    function getMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function onMove(e) {
        if(!dragging || isDone) return;
        const m = getMouse(e), lvl = LEVELS[curLvl];
        lvl.pts.forEach((p, i) => {
            if(Math.hypot(p.x - m.x, p.y - m.y) < 25 && (i + 1 === nextTarget)) {
                connected.push(i); nextTarget++;
                if(connected.length === lvl.pts.length) {
                    isDone = true;
                    // Lógica de mensaje final
                    if(curLvl === LEVELS.length - 1) {
                        msgBox.innerText = "¡FELICIDADES! COMPLETASTE TODO 🏆✨";
                        msgBox.classList.add('victory-flash');
                    } else {
                        msgBox.innerText = "¡GENIAL! ¡Pasa al siguiente! ✨";
                    }
                }
                updateUI(); draw();
            }
        });
    }

    canvas.addEventListener('mousedown', () => dragging = true);
    canvas.addEventListener('touchstart', (e) => { dragging = true; e.preventDefault(); }, {passive:false});
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('touchend', () => dragging = false);

    document.getElementById('btnNext').onclick = () => { if(curLvl < LEVELS.length-1) initLvl(curLvl+1); };
    document.getElementById('btnPrev').onclick = () => { if(curLvl > 0) initLvl(curLvl-1); };
    document.getElementById('btnReset').onclick = () => initLvl(curLvl);

    initLvl(0);
})();
